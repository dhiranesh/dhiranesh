name: Update 3D contribution graph

on:
  workflow_dispatch:
  schedule:
    # Daily at 02:00 IST (20:30 UTC)
    - cron: "30 20 * * *"

permissions:
  contents: write

jobs:
  generate:
    name: Generate contribution SVGs
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate 3D graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Verify generated graph
        shell: bash
        run: |
          test -s profile-3d-contrib/profile-green-animate.svg || {
            echo "The graph SVG was not generated. Check the action log above."
            exit 1
          }

      - name: Commit updated graph assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "No contribution graph changes to commit."
          else
            git commit -m "chore: refresh 3D contribution graph"
            git push
          fi
